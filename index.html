<div class="app">

<div id="settings"></div>
</section>

</section>
</div>

function clone(x){return JSON.parse(JSON.stringify(x))}

function lib(name){return LIBRARY.find(x=>x.name===name)||{name,day:plan[activeDay]?.name||"Custom",primary:plan[activeDay]?.name||"Custom",pattern:"custom",kind:"isolation",equipment:"Custom",tip:"Use a controlled range of motion and stable technique."}}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function num(v){let n=parseFloat(String(v).replace(",","."));return Number.isFinite(n)?n:0}
function range(s){let m=String(s).match(/(\d+)\D+(\d+)/);return m?[+m[1],+m[2]]:[8,12]}
function roundLoad(v){let inc=num(prefs.increment)||2.5;return Math.max(inc,Math.round(v/inc)*inc)}
function e1rm(w,r){w=num(w);r=num(r);return w&&r?+(w*(1+r/30)).toFixed(1):0}
function toast(s){$("toast").textContent=s;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1800)}
function dayData(){return active&&active.day===activeDay?active.exercises:null}
function currentExercises(){

}
function lastRecord(name){
 for(const h of history){const x=(h.exercises||[]).find(e=>e.name===name);if(x&&x.sets?.length)return x}
 return null
}
function bestHistoricalE1RM(name){
 let best=0;for(const h of history)for(const e of h.exercises||[])if(e.name===name)for(const s of e.sets||[])best=Math.max(best,e1rm(s.weight,s.reps));return best
}
function lastText(rec){
 if(!rec||!rec.sets?.length)return "No previous performance yet.";
 return "Last: "+rec.sets.map(s=>`${s.weight}kg×${s.reps} RIR${s.rir===""?"–":s.rir}`).join(" · ")
}
function recommend(ex){
 const prev=lastRecord(ex.name),[lo,hi]=range(ex.reps),read=active?.readiness||"Normal";
 if(!prev||!prev.sets?.length)return {tag:"BASELINE",weight:0,msg:`Choose a load for ${lo}–${hi} clean reps around RIR ${prefs.targetRir}.`,last:"No previous performance yet."};
 let sets=prev.sets.filter(s=>num(s.weight)>0&&num(s.reps)>0);if(!sets.length)return {tag:"BASELINE",weight:0,msg:`Choose a load for ${lo}–${hi} reps.`,last:lastText(prev)};
 let base=Math.max(...sets.map(s=>num(s.weight))),same=sets.filter(s=>num(s.weight)===base),reps=same.map(s=>num(s.reps)),rirs=same.map(s=>s.rir===""?prefs.targetRir:num(s.rir));
 let avgRir=rirs.reduce((a,b)=>a+b,0)/rirs.length,allTop=reps.every(r=>r>=hi),below=reps.filter(r=>r<lo).length;
 if(read==="Tired"){let w=roundLoad(base*.95);return {tag:"READINESS",weight:w,msg:`You marked Tired. Use about ${w} kg and keep 2–3 reps in reserve.`,last:lastText(prev)}}
 if(allTop&&avgRir>=1){let w=roundLoad(base+prefs.increment);return {tag:"INCREASE",weight:w,msg:`Progress to ${w} kg. Aim for ${lo}–${Math.min(hi,lo+2)} reps around RIR ${prefs.targetRir}.`,last:lastText(prev)}}
 if(below>=2||avgRir<.5){let w=roundLoad(base*.95);return {tag:"REDUCE",weight:w,msg:`Performance was below target. Use about ${w} kg and rebuild inside ${lo}–${hi} reps.`,last:lastText(prev)}}
 let total=reps.reduce((a,b)=>a+b,0);return {tag:"BUILD REPS",weight:base,msg:`Keep ${base} kg and beat ${total} total reps while staying near RIR ${prefs.targetRir}.`,last:lastText(prev)}
}
function warmups(ex,w){
 w=num(w);if(!w)return "";
 let L=lib(ex.name),arr=L.kind==="compound"?[[.4,8],[.6,5],[.8,3]]:[[.5,8]];
 return arr.map(x=>`${roundLoad(w*x[0])}kg×${x[1]}`).join(" → ")
}
function plannedRest(ex,rir){
 let L=lib(ex.name),base=num(ex.rest)||(L.kind==="compound"?prefs.compoundRest:prefs.isolationRest);
 if(num(rir)<=1)base+=30;if(active?.readiness==="Tired")base+=15;return base
}
function estimateMinutes(exs){
 let m=5;for(const e of exs){let L=lib(e.name),rest=num(e.rest)||(L.kind==="compound"?prefs.compoundRest:prefs.isolationRest);m+=e.sets*(.65+rest/60)}return Math.round(m)
}
function applyTimeBudget(exs,mins){
 let used=5;return exs.map(e=>{let est=e.sets*(.65+(num(e.rest)||90)/60);let optional=used+est>mins&&e.priority>2;if(!optional)used+=est;return {...e,optional}})
}
function deloadSignal(day){
 let hs=history.filter(h=>h.day===day).slice(0,3);if(hs.length<3)return null;
 let p=hs.map(h=>h.performance||0);let tired=hs.filter(h=>h.readiness==="Tired").length;
 if((p[0]&&p[1]&&p[2]&&p[0]<p[1]*.98&&p[1]<p[2]*.98)||tired>=2)return "Performance/readiness has trended down across recent sessions. Consider a deload: reduce load ~10% and sets ~30–40% for one week.";
 return null
}

  <div class="setHead"><div>SET</div><div>KG</div><div>REPS</div><div>RIR</div><div></div></div>${rows}

  <div class="field" style="margin-top:7px"><label>Personal setup notes</label><textarea onchange="setExercise(${i},'notes',this.value)" placeholder="Seat 4, pin 6, grip, bench angle...">${esc(ex.notes||"")}</textarea></div>

  </div></div>`
 }).join("")
}
window.toggleEx=i=>$("ex"+i).classList.toggle("open");
function ensureActive(){

}
window.setVal=(i,j,f,v)=>{if(!ensureActive())return;active.exercises[i].rows[j][f]=v;saveActive()}
window.setExercise=(i,f,v)=>{if(active&&active.day===activeDay){active.exercises[i][f]=f==="rest"?num(v):v;let p=plan[activeDay].exercises.find(x=>x.name===active.exercises[i].name);if(p)p[f]=active.exercises[i][f];saveActive();savePlan()}else{plan[activeDay].exercises[i][f]=f==="rest"?num(v):v;savePlan()}renderAll()}
window.applyWeight=(i,w)=>{if(!ensureActive())return;active.exercises[i].rows.forEach(r=>{if(!r.weight)r.weight=w});saveActive();renderExercises();toast("Target applied")}
window.completeSet=(i,j)=>{
 if(!ensureActive())return;let r=active.exercises[i].rows[j];r.done=!r.done;saveActive();renderHero();renderExercises();
 if(r.done){let next=findNext(i,j);if(next)startTimer(plannedRest(active.exercises[i],r.rir),next);else toast("All planned sets complete")}
}
function findNext(i,j){
 for(let a=i;a<active.exercises.length;a++){if(active.exercises[a].optional)continue;for(let b=(a===i?j+1:0);b<active.exercises[a].rows.length;b++)if(!active.exercises[a].rows[b].done)return {i:a,j:b,ex:active.exercises[a]}}
 for(let a=0;a<active.exercises.length;a++)for(let b=0;b<active.exercises[a].rows.length;b++)if(!active.exercises[a].rows[b].done)return {i:a,j:b,ex:active.exercises[a]};

}

 <div class="field"><label>Time available today</label><select id="startMinutes">${[30,45,60,75,90].map(x=>`<option ${x===60?"selected":""}>${x}</option>`).join("")}</select></div>

 active={day:activeDay,start:Date.now(),readiness,minutes:mins,exercises:applyTimeBudget(base,mins)};saveActive();closeModal();renderAll();toast("Smart workout started")

function startTimer(sec,next){
 if(timer)clearInterval(timer);timerLeft=sec;timerTotal=sec;timerPaused=false;timerNext=next;$("timerOverlay").classList.add("show");$("pauseTimerBtn").textContent="Pause";drawTimer();
 $("nextInfo").innerHTML=`<b>Next → ${esc(next.ex.name)} · Set ${next.j+1}</b><br><span class="meta">📍 ${esc(next.ex.machine||"Machine/station not saved yet")}</span><br><span class="meta">Target ${esc(next.ex.reps)} reps</span>`;
 timer=setInterval(()=>{if(!timerPaused){timerLeft--;drawTimer();if(timerLeft<=0)endTimer()}},1000)
}
function drawTimer(){let m=Math.floor(Math.max(0,timerLeft)/60),s=Math.max(0,timerLeft)%60;$("timerText").textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;$("timerCircle").style.setProperty("--p",(Math.max(0,timerLeft)/timerTotal*100)+"%")}
window.toggleTimer=()=>{timerPaused=!timerPaused;$("pauseTimerBtn").textContent=timerPaused?"Resume":"Pause"}
window.addTime=s=>{timerLeft+=s;timerTotal+=s;drawTimer()}
window.skipTimer=()=>{if(timer)clearInterval(timer);$("timerOverlay").classList.remove("show")}
function endTimer(){if(timer)clearInterval(timer);$("timerOverlay").classList.remove("show");if(navigator.vibrate)navigator.vibrate([150,80,150]);if(timerNext){setTimeout(()=>{let el=$("ex"+timerNext.i);if(el){el.classList.add("open");el.scrollIntoView({behavior:"smooth",block:"center"})}},100)}toast("Rest finished")}

function performanceIndex(exs){
 let vals=[];for(const e of exs){if(lib(e.name).kind!=="compound")continue;let best=Math.max(0,...(e.sets||e.rows||[]).map(s=>e1rm(s.weight,s.reps)));if(best)vals.push(best)}return vals.length?+(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1):0
}
window.finishWorkout=()=>{
 if(!active||active.day!==activeDay)return;
 let completed=0,volume=0,prs=0,detail=active.exercises.map(e=>{let sets=e.rows.filter(r=>r.done).map(r=>{completed++;volume+=num(r.weight)*num(r.reps);let est=e1rm(r.weight,r.reps);if(est>bestHistoricalE1RM(e.name))prs++;return {weight:num(r.weight),reps:num(r.reps),rir:r.rir,e1rm:est}});return {name:e.name,primary:lib(e.name).primary,sets,machine:e.machine,notes:e.notes,reps:e.reps}});
 let perf=performanceIndex(detail),prev=history.find(h=>h.day===activeDay),vDelta=prev&&prev.volume?Math.round((volume-prev.volume)/prev.volume*100):null,pDelta=prev&&prev.performance?Math.round((perf-prev.performance)/prev.performance*100):null;
 let analysis=prev?`Volume ${vDelta>=0?"+":""}${vDelta}% vs last ${plan[activeDay].name}. ${perf&&prev.performance?`Compound performance ${pDelta>=0?"+":""}${pDelta}%. `:""}${prs?`${prs} estimated PR set${prs>1?"s":""}.`:"No new estimated PR this session."}`:`Baseline saved. The coach will use this workout to set your next targets.`;
 history.unshift({date:new Date().toISOString(),day:activeDay,name:plan[activeDay].name,readiness:active.readiness,minutes:Math.max(1,Math.round((Date.now()-active.start)/60000)),sets:completed,volume:Math.round(volume),performance:perf,prs,analysis,exercises:detail});history=history.slice(0,150);saveHistory();
 // preserve plan/machine notes; reset session.
 active.exercises.forEach(a=>{let p=plan[activeDay].exercises.find(x=>x.name===a.name);if(p){p.machine=a.machine;p.notes=a.notes;p.rest=a.rest}});savePlan();active=null;saveActive();renderAll();toast("Workout analysed and saved")
}

function openModal(title,body){$("modalTitle").textContent=title;$("modalBody").innerHTML=body;$("modalOverlay").classList.add("show")}
window.closeModal=()=>$("modalOverlay").classList.remove("show")
window.showTips=i=>{let e=currentExercises()[i],L=lib(e.name),rec=recommend(e);openModal(e.name,`<p>${esc(L.tip)}</p><div class="volumeCard"><b>Coach target</b><p class="meta">${rec.msg}</p><p class="meta">Target RIR: ${prefs.targetRir}. Rest is automatically extended after very hard sets.</p></div>`)}
window.showHistory=i=>{let e=currentExercises()[i],rows=[];for(const h of history){let x=(h.exercises||[]).find(y=>y.name===e.name);if(x?.sets?.length)rows.push({date:h.date,x})}openModal(e.name+" History",rows.length?rows.slice(0,8).map(r=>`<div class="hist"><div class="histTop"><b>${new Date(r.date).toLocaleDateString()}</b></div><p>${r.x.sets.map((s,k)=>`Set ${k+1}: ${s.weight}kg × ${s.reps} · RIR ${s.rir===""?"–":s.rir} · e1RM ${s.e1rm}`).join("<br>")}</p></div>`).join(""):'<div class="empty">No history yet.</div>')}

window.openSwap=i=>{
 let e=currentExercises()[i],L=lib(e.name);window.swapIndex=i;window.swapContext=active&&active.day===activeDay?"active":"plan";
 let body=`<p class="meta">Recommended same-pattern alternatives appear first. Search the full ${LIBRARY.length}-exercise library for any machine, cable, free-weight or bodyweight option.</p><input class="search" id="swapSearch" placeholder="Search exercise or equipment..." oninput="renderSwap('${esc(L.pattern)}','${esc(L.day)}')"><div id="swapList"></div>`;
 openModal("Swap "+e.name,body);renderSwap(L.pattern,L.day)
}
window.renderSwap=(pattern,day)=>{
 let q=($("swapSearch")?.value||"").toLowerCase(),arr=LIBRARY.filter(x=>!q?(x.pattern===pattern||x.day===day):(x.name+" "+x.equipment+" "+x.pattern).toLowerCase().includes(q));
 arr.sort((a,b)=>(a.pattern===pattern?0:1)-(b.pattern===pattern?0:1)||a.name.localeCompare(b.name));
 $("swapList").innerHTML=arr.map(x=>`<button class="swapItem" onclick="chooseSwap('${esc(x.name).replace(/'/g,"\\'")}')"><b>${esc(x.name)}</b><small>${esc(x.primary)} · ${esc(x.equipment)} · ${x.pattern===pattern?"same movement pattern":"alternative"}</small></button>`).join("")||'<div class="empty">No match.</div>'
}
window.chooseSwap=name=>{
 let i=window.swapIndex,old=currentExercises()[i],L=lib(name);
 if(active&&active.day===activeDay){active.exercises[i].name=name;active.exercises[i].rows=Array.from({length:active.exercises[i].sets},()=>({weight:"",reps:"",rir:"",done:false}));active.exercises[i].rest=L.kind==="compound"?prefs.compoundRest:prefs.isolationRest;saveActive()}
 else{plan[activeDay].exercises[i].name=name;plan[activeDay].exercises[i].rest=L.kind==="compound"?prefs.compoundRest:prefs.isolationRest;savePlan()}
 closeModal();renderAll();toast("Exercise swapped")
}

window.openAdd=()=>{
 let body=`<div class="field"><label>Training day</label><select id="addDay">${["Mon","Tue","Wed","Thu","Fri"].map(d=>`<option value="${d}" ${d===activeDay?"selected":""}>${d} · ${plan[d].name}</option>`).join("")}</select></div>
 <input class="search" id="addSearch" placeholder="Search ${LIBRARY.length} exercises..." oninput="renderAddLibrary()"><div id="addLib"></div>
 <div class="secHead"><h3>Or create custom</h3></div>
 <div class="field"><label>Exercise name</label><input id="customName" placeholder="My exercise"></div><div class="formRow"><div class="field"><label>Sets</label><input id="customSets" value="3"></div><div class="field"><label>Rep range</label><input id="customReps" value="8–12"></div></div><div class="field"><label>Machine / station</label><input id="customMachine"></div><button class="primary" onclick="addCustom()">Add custom exercise</button>`;
 openModal("Add Exercise",body);renderAddLibrary()
}
window.renderAddLibrary=()=>{
 let q=($("addSearch")?.value||"").toLowerCase(),day=$("addDay")?.value||activeDay,dayName=plan[day].name,arr=LIBRARY.filter(x=>(!q?x.day===dayName:(x.name+" "+x.equipment+" "+x.primary).toLowerCase().includes(q))).slice(0,60);
 $("addLib").innerHTML=arr.map(x=>`<button class="swapItem" onclick="addFromLibrary('${esc(x.name).replace(/'/g,"\\'")}')"><b>${esc(x.name)}</b><small>${esc(x.primary)} · ${esc(x.equipment)}</small></button>`).join("")
}
window.addFromLibrary=name=>{let d=$("addDay").value,L=lib(name);plan[d].exercises.push({name,sets:3,reps:L.kind==="compound"?"6–10":"10–15",rest:L.kind==="compound"?prefs.compoundRest:prefs.isolationRest,priority:plan[d].exercises.length+1,machine:"",notes:""});savePlan();closeModal();activeDay=d;renderAll();toast("Exercise added")}
window.addCustom=()=>{let d=$("addDay").value,name=$("customName").value.trim();if(!name)return toast("Enter an exercise name");plan[d].exercises.push({name,sets:Math.max(1,num($("customSets").value)||3),reps:$("customReps").value||"8–12",rest:prefs.isolationRest,priority:plan[d].exercises.length+1,machine:$("customMachine").value||"",notes:""});savePlan();closeModal();activeDay=d;renderAll();toast("Custom exercise added")}

window.editPlan=(day,i)=>{
 let e=plan[day].exercises[i];window.editDay=day;window.editIndex=i;openModal("Edit Exercise",`<div class="field"><label>Exercise</label><input value="${esc(e.name)}" disabled></div><div class="formRow"><div class="field"><label>Sets</label><input id="editSets" value="${e.sets}"></div><div class="field"><label>Rep range</label><input id="editReps" value="${esc(e.reps)}"></div></div><div class="field"><label>Rest seconds</label><input id="editRest" value="${e.rest}"></div><div class="field"><label>Machine / setup</label><input id="editMachine" value="${esc(e.machine)}"></div><div class="field"><label>Notes</label><textarea id="editNotes">${esc(e.notes||"")}</textarea></div><button class="primary" onclick="saveEdit()">Save</button><button class="danger" style="width:100%;margin-top:8px" onclick="deleteExercise()">Delete Exercise</button>`)
}
window.saveEdit=()=>{let e=plan[window.editDay].exercises[window.editIndex];e.sets=Math.max(1,num($("editSets").value)||3);e.reps=$("editReps").value;e.rest=num($("editRest").value)||90;e.machine=$("editMachine").value;e.notes=$("editNotes").value;savePlan();closeModal();renderAll();toast("Exercise updated")}
window.deleteExercise=()=>{if(!confirm("Delete this exercise from the plan?"))return;plan[window.editDay].exercises.splice(window.editIndex,1);plan[window.editDay].exercises.forEach((x,i)=>x.priority=i+1);savePlan();closeModal();renderAll();toast("Exercise deleted")}
window.editActiveExercise=i=>{if(active&&active.day===activeDay){let e=active.exercises[i];openModal("Edit Today",`<div class="field"><label>Sets</label><input id="aeSets" value="${e.sets}"></div><div class="field"><label>Rep range</label><input id="aeReps" value="${esc(e.reps)}"></div><button class="primary" onclick="saveActiveEdit(${i})">Save today</button>`)}else editPlan(activeDay,i)}
window.saveActiveEdit=i=>{let e=active.exercises[i],sets=Math.max(1,num($("aeSets").value)||e.sets);e.sets=sets;e.reps=$("aeReps").value;while(e.rows.length<sets)e.rows.push({weight:"",reps:"",rir:"",done:false});e.rows=e.rows.slice(0,sets);saveActive();closeModal();renderAll()}

function renderPlan(){
 $("planList").innerHTML=["Mon","Tue","Wed","Thu","Fri"].map(d=>`<div class="planDay"><div class="planTitle"><b>${d} · ${esc(plan[d].name)}</b><button class="link" onclick="activeDay='${d}';openAdd()">+ Add</button></div>${plan[d].exercises.map((e,i)=>`<div class="planItem"><div><b>${i+1}. ${esc(e.name)}</b><small>${e.sets} sets · ${esc(e.reps)} · ${e.rest}s · ${esc(lib(e.name).equipment)}</small></div><div class="miniBtns"><button onclick="activeDay='${d}';openSwapPlan(${i})">Swap</button><button onclick="editPlan('${d}',${i})">Edit</button></div></div>`).join("")}</div>`).join("");
 renderSettings()
}
window.openSwapPlan=i=>{window.swapIndex=i;window.swapContext="plan";let e=plan[activeDay].exercises[i],L=lib(e.name);openModal("Swap "+e.name,`<p class="meta">Search the full exercise library.</p><input class="search" id="swapSearch" placeholder="Search exercise or equipment..." oninput="renderSwap('${esc(L.pattern)}','${esc(L.day)}')"><div id="swapList"></div>`);renderSwap(L.pattern,L.day)}
function renderSettings(){
 $("settings").innerHTML=`<div class="settings"><label>Weight increment (kg)<input id="prefInc" value="${prefs.increment}"></label><label>Target RIR<select id="prefRir">${[1,2,3].map(x=>`<option ${prefs.targetRir==x?"selected":""}>${x}</option>`).join("")}</select></label><label>Compound rest<select id="prefComp">${[120,150,180,210].map(x=>`<option ${prefs.compoundRest==x?"selected":""}>${x}</option>`).join("")}</select></label><label>Isolation rest<select id="prefIso">${[75,90,120].map(x=>`<option ${prefs.isolationRest==x?"selected":""}>${x}</option>`).join("")}</select></label><button class="primary small" onclick="saveSettings()">Save Settings</button><button class="danger" style="width:100%;margin-top:7px" onclick="resetPlan()">Restore Recommended Plan</button></div>`
}
window.saveSettings=()=>{prefs.increment=num($("prefInc").value)||2.5;prefs.targetRir=num($("prefRir").value)||2;prefs.compoundRest=num($("prefComp").value)||150;prefs.isolationRest=num($("prefIso").value)||90;savePrefs();renderAll();toast("Settings saved")}
window.resetPlan=()=>{if(confirm("Restore the recommended training plan? Your workout history stays saved.")){plan=clone(DEFAULT_PLAN);savePlan();active=null;saveActive();renderAll();toast("Recommended plan restored")}}

function renderHistory(){
 $("historyCount").textContent=`${history.length} workouts`;$("historyList").innerHTML=history.length?history.map(h=>`<div class="hist"><div class="histTop"><b>${esc(h.name)}</b><span>${new Date(h.date).toLocaleDateString()}</span></div><div class="histStats"><span>⏱ ${h.minutes} min</span><span>✓ ${h.sets} sets</span><span>🏋️ ${h.volume.toLocaleString()} kg</span><span>Readiness ${h.readiness||"–"}</span></div><p>${esc(h.analysis||"")}</p></div>`).join(""):'<div class="empty">Complete your first workout to start smart history.</div>'
}
function volumeMap(){
 let m={Chest:0,Back:0,Quads:0,Hamstrings:0,Glutes:0,Calves:0,Shoulders:0,Biceps:0,Triceps:0,Adductors:0};for(const d of ["Mon","Tue","Wed","Thu","Fri"])for(const e of plan[d].exercises){let p=lib(e.name).primary;m[p]=(m[p]||0)+num(e.sets)}return m
}
function renderProgress(){
 $("statWorkouts").textContent=history.length;$("statSets").textContent=history.reduce((a,h)=>a+(h.sets||0),0);$("statVolume").textContent=Math.round(history.reduce((a,h)=>a+(h.volume||0),0)/1000)+"k";
 let vm=volumeMap(),max=Math.max(1,...Object.values(vm));$("volumeSummary").innerHTML=Object.entries(vm).filter(x=>x[1]>0).map(([k,v])=>`<div class="barRow"><span>${k}</span><div class="bar"><div class="fill" style="width:${v/max*100}%"></div></div><b>${v}</b></div>`).join("");
 let best={};for(const h of history)for(const e of h.exercises||[])for(const s of e.sets||[]){let x=e1rm(s.weight,s.reps);if(x>(best[e.name]||0))best[e.name]=x}
 $("prList").innerHTML=Object.keys(best).length?Object.entries(best).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="hist"><div class="histTop"><b>${esc(k)}</b><span>e1RM ${v} kg</span></div></div>`).join(""):'<div class="empty">PR estimates appear after logged workouts.</div>'
}

window.nav=b=>{document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));$(b.dataset.id).classList.add("active");renderAll()}
window.openBackup=()=>openModal("Backup & Data",`<p class="meta">Your workout data is stored locally on this device. Export a backup before clearing Safari data or changing phones.</p><button class="primary" onclick="exportBackup()">Export Backup</button><div class="field"><label>Import backup JSON</label><input type="file" id="importFile" accept=".json,application/json"></div><button class="primary small" onclick="importBackup()">Import Backup</button>`)
window.exportBackup=()=>{let blob=new Blob([JSON.stringify({plan,history,prefs},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="my-training-smart-backup.json";a.click();URL.revokeObjectURL(a.href)}
window.importBackup=()=>{let f=$("importFile").files[0];if(!f)return toast("Choose a backup file");let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(x.plan){plan=x.plan;savePlan()}if(x.history){history=x.history;saveHistory()}if(x.prefs){prefs=x.prefs;savePrefs()}closeModal();renderAll();toast("Backup imported")}catch(e){toast("Invalid backup file")}};r.readAsText(f)}

function migrate(){
 // Bring over old machine/setup notes where names match.
 if(localStorage.getItem("mts_v4_migrated"))return;
 for(const d of DAYS){let old=JSON.parse(localStorage.getItem("mt_day_"+d)||"null");if(Array.isArray(old)&&plan[d])for(const oe of old){let p=plan[d].exercises.find(x=>x.name===oe.name);if(p){p.machine=oe.machine||p.machine;p.notes=oe.notes||p.notes}}}
 localStorage.setItem("mts_v4_migrated","1");savePlan()
}
function renderAll(){renderWeek();renderHero();renderExercises();renderPlan();renderHistory();renderProgress()}
migrate();renderAll();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(()=>{}));
</script>
</body>
</html>
